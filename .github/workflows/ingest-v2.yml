name: ingest-v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'payload/v2.b64.*'
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble catalog from shards
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          parts = sorted(Path('payload').glob('v2.b64.*'))
          print('parts', [p.name for p in parts])
          if not parts:
              raise SystemExit('no shards')
          b64 = ''.join(p.read_text().strip() for p in parts)
          html = gzip.decompress(base64.b64decode(b64))
          print('html', len(html))
          text = html.decode('utf-8')
          if 'PRESERVATION_DATA' not in text or 'The Preservation Project' not in text:
              raise SystemExit('not a preservation catalog')
          Path('index.html').write_bytes(html)
          PY
      - name: Commit self-contained app
        run: |
          git config user.name "byronevans-dev"
          git config user.email "tha.byronz@gmail.com"
          git add index.html
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "deploy v2 self-contained catalog"
          git push
