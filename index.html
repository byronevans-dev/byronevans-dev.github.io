<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>The Preservation Project</title>
  <style>html,body{margin:0;background:#0d0d0d;color:#f4efe6;font:16px/1.45 Georgia,serif}#boot{padding:48px 24px;max-width:40rem}</style>
</head>
<body>
  <div id="boot">De kelder gaat open…</div>
  <script>
  (async () => {
    const parts = ['parts/p00.txt', 'parts/p01.txt', 'parts/p02.txt', 'parts/p03.txt', 'parts/p04.txt', 'parts/p05.txt', 'parts/p06.txt', 'parts/p07.txt', 'parts/p08.txt', 'parts/p09.txt', 'parts/p10.txt', 'parts/p11.txt', 'parts/p12.txt', 'parts/p13.txt', 'parts/p14.txt', 'parts/p15.txt', 'parts/p16.txt', 'parts/p17.txt', 'parts/p18.txt', 'parts/p19.txt', 'parts/p20.txt', 'parts/p21.txt', 'parts/p22.txt', 'parts/p23.txt', 'parts/p24.txt', 'parts/p25.txt', 'parts/p26.txt', 'parts/p27.txt'];
    try {
      const texts = await Promise.all(parts.map((p) => fetch(p + '?v=20260829v2', { cache: 'no-store' }).then((r) => {
        if (!r.ok) throw new Error(p);
        return r.text();
      })));
      const html = texts.join('');
      if (!html.includes('PRESERVATION_DATA') || !html.includes('The Preservation Project')) throw new Error('payload');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('boot').innerHTML = 'De app kon niet geladen worden. Hard refresh (Ctrl+Shift+R).';
    }
  })();
  </script>
</body>
</html>
