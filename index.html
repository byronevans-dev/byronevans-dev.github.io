<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>The Preservation Project</title>
  <style>html,body{margin:0;background:#0d0d0d;color:#f4efe6;font:16px/1.45 Georgia,serif}#boot{padding:48px 24px;max-width:40rem}</style>
</head>
<body>
  <div id="boot">De kelder gaat open…</div>
  <script>
  (async () => {
    const urls = [
      'https://cdn.jsdelivr.net/gh/byronevans-dev/the-preservation-project@main/index.html',
      'https://cdn.jsdelivr.net/gh/byronevans-dev/byronevans-dev.github.io@3a8aac6cab861a734b50e41c000458d768f8b19d/index.html',
      'https://cdn.jsdelivr.net/gh/byronevans-dev/byronevans-dev.github.io@3b8d4b8cea714f970829ac43aefd940b7a4e20d0/index.html'
    ];
    for (const url of urls) {
      try {
        const res = await fetch(url, { cache: 'no-store' });
        const html = await res.text();
        if (html.includes('PRESERVATION_DATA') && html.includes('The Preservation Project')) {
          document.open();
          document.write(html);
          document.close();
          return;
        }
      } catch (e) {}
    }
    document.getElementById('boot').innerHTML = 'De app kon niet geladen worden. Open <a href="https://github.com/byronevans-dev/the-preservation-project" style="color:#d5ad4d">de repository</a> en download index.html.';
  })();
  </script>
</body>
</html>
