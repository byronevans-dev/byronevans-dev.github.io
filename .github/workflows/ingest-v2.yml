name: ingest-v2
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public URL of the catalog HTML or a zip that contains index.html
        required: true
        default: https://filebin.net/archive/preservationv2/zip
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download catalog
        env:
          SRC_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 -A "Mozilla/5.0" -o /tmp/payload.bin "$SRC_URL"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          raw = Path('/tmp/payload.bin').read_bytes()
          print('downloaded', len(raw), raw[:4])
          if raw[:2] == b'PK':
              zpath = Path('/tmp/payload.zip')
              zpath.write_bytes(raw)
              with zipfile.ZipFile(zpath) as zf:
                  names = zf.namelist()
                  print('zip names', names)
                  member = next((n for n in names if n.endswith('index.html') or n.endswith('.html')), names[0])
                  data = zf.read(member)
          else:
              data = raw
          print('catalog bytes', len(data))
          if len(data) < 200000:
              raise SystemExit('download too small')
          text = data.decode('utf-8', errors='replace')
          if 'PRESERVATION_DATA' not in text or 'The Preservation Project' not in text:
              raise SystemExit('not a preservation catalog')
          Path('index.html').write_bytes(data)
          PY
      - name: Commit self-contained app
        run: |
          git config user.name "byronevans-dev"
          git config user.email "tha.byronz@gmail.com"
          git add index.html
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "deploy v2 self-contained catalog"
          git push
