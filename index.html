<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>The Preservation Project</title>
  <style>html,body{margin:0;background:#0d0d0d;color:#f4efe6;font:16px/1.45 Georgia,serif}#boot{padding:48px 24px;max-width:40rem}</style>
</head>
<body>
  <div id="boot">De kelder gaat open…</div>
  <script>
  (async () => {
    const parts = Array.from({length: 31}, (_, i) => 'parts/p' + String(i).padStart(2, '0') + '.txt');
    const remotes = [
      'https://cdn.jsdelivr.net/gh/byronevans-dev/the-preservation-project@main/index.html',
      'https://raw.githubusercontent.com/byronevans-dev/the-preservation-project/main/index.html',
      'https://cdn.jsdelivr.net/gh/byronevans-dev/byronevans-dev.github.io@3a8aac6cab861a734b50e41c000458d768f8b19d/index.html'
    ];
    const looksLikeApp = (html) => html.includes('PRESERVATION_DATA') && html.includes('The Preservation Project');
    const write = (html) => { document.open(); document.write(html); document.close(); };
    try {
      const texts = await Promise.all(parts.map((p) => fetch(p + '?v=20260829v2', { cache: 'no-store' }).then((r) => {
        if (!r.ok) throw new Error(p);
        return r.text();
      })));
      const html = texts.join('');
      if (looksLikeApp(html)) { write(html); return; }
    } catch (e) {}
    for (const url of remotes) {
      try {
        const res = await fetch(url, { cache: 'no-store' });
        const html = await res.text();
        if (looksLikeApp(html)) { write(html); return; }
      } catch (e) {}
    }
    document.getElementById('boot').innerHTML = 'De app kon niet geladen worden. Hard refresh (Ctrl+Shift+R) of open de repository.';
  })();
  </script>
</body>
</html>
