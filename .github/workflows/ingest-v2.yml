name: ingest-v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ingest-v2.yml'
      - 'payload/v2.b64.*'
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and write self-contained v2 catalog
        run: |
          python3 - <<'PY'
          import gzip, hashlib, urllib.request
          from pathlib import Path
          url = 'https://paste.rs/ti19U'
          req = urllib.request.Request(url, headers={'User-Agent': 'preservation-ingest'})
          raw = urllib.request.urlopen(req, timeout=60).read()
          print('downloaded', len(raw), hashlib.sha256(raw).hexdigest())
          expect = 'dffde6ae5d6b32a804755b29b86324dfb56f05cf3a6d0a42dff8a9f2fe0dcafa'
          got = hashlib.sha256(raw).hexdigest()
          if got != expect:
              raise SystemExit('checksum mismatch ' + got)
          html = gzip.decompress(raw)
          text = html.decode('utf-8')
          print('html', len(html))
          if 'PRESERVATION_DATA' not in text or 'The Preservation Project' not in text:
              raise SystemExit('not a preservation catalog')
          Path('index.html').write_bytes(html)
          PY
      - name: Commit self-contained app
        run: |
          git config user.name "byronevans-dev"
          git config user.email "tha.byronz@gmail.com"
          git add index.html
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "deploy v2 self-contained catalog"
          git push
