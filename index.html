<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>The Preservation Project</title>
  <style>html,body{margin:0;background:#0d0d0d;color:#f4efe6;font:16px/1.45 Georgia,serif}#boot{padding:48px 24px;max-width:40rem}</style>
</head>
<body>
  <div id="boot">De kelder gaat open…</div>
  <script>
  (async () => {
    const boot = document.getElementById('boot');
    const looksLikeApp = (html) => html.includes('The Preservation Project') && html.includes('PRESERVATION_DATA');
    const write = (html) => { document.open(); document.write(html); document.close(); };
    try {
      const res = await fetch('payload/v2.html.gz.b64?v=20260829v2live', { cache: 'no-store' });
      if (!res.ok) throw new Error('payload ' + res.status);
      const b64 = (await res.text()).replace(/\s+/g, '');
      const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(stream).text();
      if (!looksLikeApp(html)) throw new Error('catalog');
      write(html);
    } catch (e) {
      boot.textContent = 'De app kon niet geladen worden. Hard refresh (Ctrl+Shift+R).';
    }
  })();
  </script>
</body>
</html>
